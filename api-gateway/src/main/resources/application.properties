server.port=8080
spring.application.name=api-gateway

# Eureka Service Discovery
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# JWT
app.jwt.secret=${APP_JWT_SECRET:your-secret-key-change-in-production}

# Record API gateway rate limiting
app.rate-limit.records.capacity=${APP_RATE_LIMIT_RECORDS_CAPACITY:60}
app.rate-limit.records.refill-tokens=${APP_RATE_LIMIT_RECORDS_REFILL_TOKENS:60}
app.rate-limit.records.refill-period-seconds=${APP_RATE_LIMIT_RECORDS_REFILL_PERIOD_SECONDS:60}
app.rate-limit.records.redis-enabled=${APP_RATE_LIMIT_RECORDS_REDIS_ENABLED:true}

# Gateway Routes
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**
spring.cloud.gateway.routes[0].filters[0]=CorrelationIdFilter

spring.cloud.gateway.routes[1].id=user-service
spring.cloud.gateway.routes[1].uri=lb://user-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/users/**
spring.cloud.gateway.routes[1].filters[0]=CorrelationIdFilter
spring.cloud.gateway.routes[1].filters[1]=AuthenticationFilter

spring.cloud.gateway.routes[2].id=record-service
spring.cloud.gateway.routes[2].uri=lb://record-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/records/**
spring.cloud.gateway.routes[2].filters[0]=CorrelationIdFilter
spring.cloud.gateway.routes[2].filters[1]=AuthenticationFilter
spring.cloud.gateway.routes[2].filters[2]=RecordRateLimitFilter

spring.cloud.gateway.routes[3].id=dashboard-service
spring.cloud.gateway.routes[3].uri=lb://dashboard-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/dashboard/**
spring.cloud.gateway.routes[3].filters[0]=CorrelationIdFilter
spring.cloud.gateway.routes[3].filters[1]=AuthenticationFilter

# Load Balancer
spring.cloud.loadbalancer.ribbon.enabled=false
