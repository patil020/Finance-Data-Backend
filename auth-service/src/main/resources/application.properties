spring.application.name=auth-service
server.port=8081

# Service Discovery - Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}
eureka.instance.prefer-ip-address=true

# Redis Configuration
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finance_auth?createDatabaseIfNotExist=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:manager}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Development seed account
app.auth.seed-admin-enabled=${APP_AUTH_SEED_ADMIN_ENABLED:true}
app.auth.seed-admin-email=${APP_AUTH_SEED_ADMIN_EMAIL:admin@finance.com}
app.auth.seed-admin-password=${APP_AUTH_SEED_ADMIN_PASSWORD:password123}
app.auth.seed-admin-roles=${APP_AUTH_SEED_ADMIN_ROLES:ADMIN,USER}

# Distributed token-bucket rate limiting
app.rate-limit.auth.capacity=${APP_RATE_LIMIT_AUTH_CAPACITY:10}
app.rate-limit.auth.refill-tokens=${APP_RATE_LIMIT_AUTH_REFILL_TOKENS:10}
app.rate-limit.auth.refill-period-seconds=${APP_RATE_LIMIT_AUTH_REFILL_PERIOD_SECONDS:60}
app.rate-limit.auth.redis-enabled=${APP_RATE_LIMIT_AUTH_REDIS_ENABLED:true}

# JWT Configuration
app.jwt.secret=${APP_JWT_SECRET:your-secret-key-change-in-production}
app.jwt.access-expiration-ms=900000
app.jwt.refresh-expiration-ms=604800000

# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.auth-service.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.auth-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.auth-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.auth-service.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.auth-service.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.auth-service.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.auth-service.failureRateThreshold=50
resilience4j.circuitbreaker.instances.auth-service.recordExceptions=java.io.IOException,java.util.concurrent.TimeoutException
resilience4j.circuitbreaker.instances.auth-service.ignoreExceptions=com.financeapp.common.ServiceException

# Retry Configuration
resilience4j.retry.instances.auth-service.maxAttempts=3
resilience4j.retry.instances.auth-service.waitDuration=1000
resilience4j.retry.instances.auth-service.retryExceptions=java.io.IOException

# Actuator
management.endpoints.web.exposure.include=health,metrics,circuitbreakers
management.endpoint.health.show-details=always
