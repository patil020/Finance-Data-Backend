spring.application.name=dashboard-service
server.port=8084

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Dashboard cache/read-model settings
app.dashboard.cache-ttl-minutes=${APP_DASHBOARD_CACHE_TTL_MINUTES:60}
app.dashboard.records-page-size=${APP_DASHBOARD_RECORDS_PAGE_SIZE:500}
app.dashboard.records-max-pages=${APP_DASHBOARD_RECORDS_MAX_PAGES:20}

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=dashboard-service
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
