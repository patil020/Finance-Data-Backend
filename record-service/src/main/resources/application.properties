spring.application.name=record-service
server.port=8083

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:localhost}

# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/finance_records?createDatabaseIfNotExist=true&useSSL=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:manager}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Redis Cache
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.cache.type=redis

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.publish-timeout-seconds=${APP_KAFKA_PUBLISH_TIMEOUT_SECONDS:5}

# Transactional outbox
app.outbox.publish-initial-delay-ms=${APP_OUTBOX_PUBLISH_INITIAL_DELAY_MS:5000}
app.outbox.publish-fixed-delay-ms=${APP_OUTBOX_PUBLISH_FIXED_DELAY_MS:5000}
app.outbox.max-attempts=${APP_OUTBOX_MAX_ATTEMPTS:5}

# Circuit Breaker
resilience4j.circuitbreaker.instances.record-service.slidingWindowSize=10
resilience4j.circuitbreaker.instances.record-service.minimumNumberOfCalls=5
resilience4j.circuitbreaker.instances.record-service.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.record-service.failureRateThreshold=50
